name: CI

on:
  push:
    branches: [main, feature/*]
    paths:
      - "frontend-next/**"
  pull_request:
    paths:
      - "frontend-next/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build
